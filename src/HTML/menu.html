<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shika|Market</title>
    <link rel="stylesheet" href="../CSS/menu.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

  </head>
  <body>
    <head>
      <div class="container-xl">
        <nav
          class="navbar navbar-expand-lg site-nav"
          aria-label="Main navigation"
        >
          <a
            class="navbar-brand wordmark"
            href="../../index.html"
            aria-label=" Market home"
            ><spa class="container" style="font-size: 50px; color: rgb(78, 215, 78);">Shika|Market</spa   n></a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNav"
            aria-controls="#mainNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
          <!-- aria-expaned="false" effect to three line -->
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav mx-lg-auto nav-links">
              <li class="nav-item">
                <a class=" btn" href="../../index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class=" btn" href="../HTML/about.html">About</a>
              </li>
              <li class="nav-item">
                <a class="btn" href="">Menu</a>
              </li>
              <li class="nav-item">
                <a class="btn" href="../HTML/contact.html">Contact</a>
              </li>
            </ul>
            <!-- User and cart -->
            <div class="nav-actions">
              
              <a
                class="icon-button account-link"
                href="../HTML/user.html"
                aria-label="Your account"
              >
                <img src="../img/user.svg" alt="">
              </a>
              <a
                class="bag-link"
                href="../HTML/cart.html"
                aria-label="Shopping bag, 0 items"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 8h14l1 13H4L5 8Z"></path>
                  <path d="M9 9V6a3 3 0 0 1 6 0v3"></path>
                </svg>
                <span class="bag-count">0</span>
              </a>
            </div>
          </div>
        </nav>

        <form
          class="search-row"
          role="search"
          onsubmit="
            event.preventDefault(); //dont refresh the page
            document
              .getElementById('new-arrivals')
              .scrollIntoView({ behavior: 'smooth' });
          "
        >
          <label class="visually-hidden" for="marketSearch"
            >Search the shop</label
          >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 5 5"></path>
          </svg>
          <input
            id="marketSearch"
            type="search"
            placeholder="Search something"
          />
          <span class="search-hint">Try "Potato”</span>
        </form>
      </div>
    </head>
    <br>
    <main class="container">
      <center>
        <h1>This menu page</h1>
      </center>
    </main>
  

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
